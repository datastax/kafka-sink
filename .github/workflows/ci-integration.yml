name: Integration tests

on:
  pull_request:
    branches:
      - 1.x
  push:
    branches:
      - 1.x

jobs:
  owasp-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: 11
          distribution: 'temurin'

      - name: Run OWASP check
        run: mvn -B -ntp verify -Powasp-dependency-check -Dcheckstyle.skip=true -DskipTests

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - '11'
          - '21'
        cassandra:
          - cassandra_version: 3.0.27
            ccm_version: 3.0.27
            is_dse: false
          - cassandra_version: 3.11.13
            ccm_version: 3.11.13
            is_dse: false
          - cassandra_version: 4.0.4
            ccm_version: 4.0.4
            is_dse: false
          - cassandra_version: dse-5.1
            ccm_version: 5.1.31
            is_dse: true
          - cassandra_version: dse-6.0
            ccm_version: 6.0.18
            is_dse: true
          - cassandra_version: dse-6.7
            ccm_version: 6.7.17
            is_dse: true
          - cassandra_version: dse-6.8
            ccm_version: 6.8.24
            is_dse: true

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          java-version: 8
          distribution: 'temurin'
      - name: Save JDK8 path
        run: |
          export JDK8_PATH=$JAVA_HOME
          echo "JDK8_PATH=$JDK8_PATH" >> $GITHUB_ENV
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Pre set up Python
        run: |
          #!/bin/bash
          # This step is need to not make setup-python fails
          set -e
          echo """
          pyYaml 
          six 
          psutil
          """ > requirements.txt
      - name: Set up Python
        uses: MatteoH2O1999/setup-python@v1
        with:
          python-version: '2.7'
          cache: 'pip'
          allow-build: info
          cache-build: true
      - name: Generate installation token for CCM private
        if: ${{ matrix.cassandra.is_dse }}
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RIPTANO_CCM_PRIVATE_APP_ID }}
          private-key: ${{ secrets.RIPTANO_CCM_APP_PRIVATE_KEY }}
          owner: riptano
          repositories: ccm-private
      - name: Setup CCM private
        if: ${{ matrix.cassandra.is_dse }}
        env:
          CLONE_RIPTANO_CCM_SECRET: ${{ steps.generate-token.outputs.token }}
        run: |
          #!/bin/bash
          set -e
          echo "Cloning the repo"
          echo $CLONE_RIPTANO_CCM_SECRET
          git clone https://x-access-token:${CLONE_RIPTANO_CCM_SECRET}@github.com/riptano/ccm-private.git
          cd ccm-private
          echo "pip install requirements"
          pip install -r requirements.txt
          echo "setup.py install"
          ./setup.py install
      - name: Setup CCM
        if: ${{ !matrix.cassandra.is_dse }}
        run: |
          #!/bin/bash
          pip install ccm
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with JDK ${{ matrix.java }}
        run: mvn -B clean install -DskipTests

      - name: Run integration tests
        run: |
          set -e
          echo "Running tests,  cassandra: ${{ matrix.cassandra.cassandra_version }}, ${{ matrix.cassandra.ccm_version }}, ${{ matrix.cassandra.is_dse }}"  
          PREV_IFS=$IFS
          IFS=':'
          IFS=$PREV_IFS
          
          if [[ "${{ matrix.cassandra.is_dse }}" == "true" ]]; then
            export CCM_SERVER_TYPE=dse
            export CCM_IS_DSE=true
            export DSE_VERSION=${{ matrix.cassandra.ccm_version }}
          else
            export CCM_SERVER_TYPE=cassandra
            export CCM_IS_DSE=false
          fi
          
          export CASSANDRA_VERSION=${{ matrix.cassandra.cassandra_version }}
          export CCM_CASSANDRA_VERSION=${{ matrix.cassandra.ccm_version }}
          export CCM_VERSION=${{ matrix.cassandra.ccm_version }}
          
          mvn verify -Pmedium -pl sink \
            -Ddsbulk.ccm.CCM_VERSION=$CCM_VERSION \
            -Ddsbulk.ccm.CCM_IS_DSE=$CCM_IS_DSE \
            -Ddsbulk.ccm.JAVA_HOME="$JDK8_PATH" \
            -Dmax.ccm.clusters=1 \
            -DredirectTestOutputToFile=false || (echo "Build failed" && find "/tmp/" -name "debug.log" -exec cat {} + && find "/tmp/" -name "system.log" -exec cat {} + && exit 1)

      - name: Run integration tests (tests)
        run: |
          echo "Running tests, pulsar: ${{ matrix.pulsar }}, cassandra: ${{ matrix.cassandra.cassandra_version }}, ${{ matrix.cassandra.ccm_version }}, ${{ matrix.cassandra.is_dse }}"  
          PREV_IFS=$IFS
          IFS=':'
          IFS=$PREV_IFS
          
          if [[ "${{ matrix.cassandra.is_dse }}" == "true" ]]; then
            export CCM_SERVER_TYPE=dse
            export CCM_IS_DSE=true
            export DSE_VERSION=${{ matrix.cassandra.ccm_version }}
          else
            export CCM_SERVER_TYPE=cassandra
            export CCM_IS_DSE=false
          fi
          
          export CASSANDRA_VERSION=${{ matrix.cassandra.cassandra_version }}
          export CCM_CASSANDRA_VERSION=${{ matrix.cassandra.ccm_version }}
          export CCM_VERSION=${{ matrix.cassandra.ccm_version }}
          
          env
          
          mvn verify -Pmedium -pl sink \
            -Ddsbulk.ccm.CCM_VERSION=$CCM_VERSION \
            -Ddsbulk.ccm.CCM_IS_DSE=$CCM_IS_DSE \
            -Ddsbulk.ccm.JAVA_HOME="$JDK8_PATH" \
            -Dmax.ccm.clusters=1 \
            -DredirectTestOutputToFile=false
